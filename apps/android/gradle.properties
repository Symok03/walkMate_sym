# The repository is intentionally stored under a Korean Windows path.
android.overridePathCheck=true

# Keep Android/Kotlin compilation stable with the bundled voice and vision assets.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
developmentOfflineLogin=true
walksafe.postLoginDeviceCheckRequired=false
developmentOnboardingBypass=true
